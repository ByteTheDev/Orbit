name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-15
            platform: macos
          - os: ubuntu-24.04
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Install NSIS
        if: runner.os == 'Windows'
        run: |
          choco install nsis -y --no-progress
          "${env:ProgramFiles(x86)}\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Test frontend
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Test Go
        run: go test ./...
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: |
          wails3 build
          wails3 package
      - name: Build macOS and Linux application
        if: runner.os != 'Windows'
        run: wails3 build
      - name: Package macOS application
        if: runner.os == 'macOS'
        run: wails3 package
      - name: Package macOS installer
        if: runner.os == 'macOS'
        run: pkgbuild --component bin/Orbit.app --install-location /Applications bin/Orbit-macos.pkg
      - name: Package Linux installer
        if: runner.os == 'Linux'
        run: |
          mkdir -p package/DEBIAN package/usr/bin package/usr/share/applications package/usr/share/icons/hicolor/256x256/apps
          install -m 755 bin/Orbit package/usr/bin/orbit
          install -m 644 build/appicon.png package/usr/share/icons/hicolor/256x256/apps/orbit.png
          printf '[Desktop Entry]\nType=Application\nName=Orbit\nExec=orbit\nIcon=orbit\nCategories=Development;\nTerminal=false\n' > package/usr/share/applications/orbit.desktop
          printf 'Package: orbit\nVersion: 1.0.0\nArchitecture: amd64\nMaintainer: Orbit <spoiledmonster13@gmail.com>\nDepends: libgtk-4-1, libwebkitgtk-6.0-4\nDescription: Desktop orchestrator for coding agents\n' > package/DEBIAN/control
          dpkg-deb --build --root-owner-group package bin/Orbit-linux-amd64.deb
          dpkg-deb --info bin/Orbit-linux-amd64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: orbit-installer-${{ matrix.platform }}
          path: |
            bin/*-installer.exe
            bin/*.pkg
            bin/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
